<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dadi FC27</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>FC27 - GENERATORE DADI</h1>

    <div class="mode-selector">
      <button id="btn-d20" class="tab-btn active">D20 (Mensile)</button>
      <button id="btn-d6" class="tab-btn">D6 (Mercato)</button>
    </div>

    <div class="dice-container">
      <div id="dice-display">?</div>
    </div>

    <button id="roll-button">LANCIA DADO</button>

    <div class="result-container">
      <div id="result-title">Modalità D20 Attiva</div>
      <div id="result-desc">Clicca su LANCIA DADO per estrarre l'imprevisto.</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
